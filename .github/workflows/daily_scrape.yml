name: Daily Job Scrape

# Runs every day at 8:00 AM America/New_York (year-round, DST-aware), and can
# also be triggered on demand from the dashboard's "Refresh jobs" button via
# the workflow_dispatch API.
#
#   12:00 UTC = 8am EDT (summer)   13:00 UTC = 8am EST (winter)
#
# Both cron times fire, but the guard below only proceeds when the local
# Eastern hour is actually 08, so exactly one run happens per day across the
# DST boundary.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Gate to 8am America/New_York
        id: guard
        run: |
          H=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (event=${{ github.event_name }}, ET hour=$H)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 8am ET (hour=$H) — skipping this trigger."
          fi

      - name: Checkout repository
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip tooling
        if: steps.guard.outputs.run == 'true'
        run: python -m pip install --upgrade pip setuptools packaging

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Run JobSpy ingestion
        if: steps.guard.outputs.run == 'true'
        working-directory: agent
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: PYTHONPATH=src python src/run_jobspy_ingestion.py

      # Fallback source (SimplifyJobs New-Grad-Positions). `!cancelled()` so it
      # still runs if the JobSpy step above failed.
      - name: Run New-Grad GitHub ingestion (fallback)
        if: steps.guard.outputs.run == 'true' && !cancelled()
        working-directory: agent
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: PYTHONPATH=src python src/run_new_grad_github_ingestion.py
