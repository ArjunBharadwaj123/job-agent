name: Daily Email Status Scan

# Runs every day at 8:00 AM America/New_York (year-round, DST-aware), alongside
# the job scrape, so the daily automated refresh mirrors the dashboard's
# "Refresh jobs" button (scrape + email status scan).
#
#   12:00 UTC = 8am EDT (summer)   13:00 UTC = 8am EST (winter)
#
# Both cron times fire, but the guard below only proceeds when the local
# Eastern hour is actually 08, so exactly one run happens per day across the
# DST boundary.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  email-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Gate to 8am America/New_York
        id: guard
        run: |
          H=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (event=${{ github.event_name }}, ET hour=$H)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 8am ET (hour=$H) — skipping this trigger."
          fi

      - name: Checkout repository
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip tooling
        if: steps.guard.outputs.run == 'true'
        run: python -m pip install --upgrade pip setuptools packaging

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Run Gmail status scan
        if: steps.guard.outputs.run == 'true'
        working-directory: agent
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: PYTHONPATH=src python src/run_email_status_scan.py
