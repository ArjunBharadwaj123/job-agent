name: Daily Job Agent

on:
  schedule:
    # True 9:00 AM Eastern year-round. GitHub cron is fixed UTC and does not
    # follow daylight saving, so we register BOTH offsets and let the "guard"
    # step below run the job only when it's actually 09:xx in New York:
    #   13:00 UTC = 9am EDT (summer)   14:00 UTC = 9am EST (winter)
    # Exactly one of these is 9am ET on any given day; the other skips.
    # NOTE: scheduled triggers only fire from the DEFAULT branch (main).
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Gate to 9am America/New_York
        id: guard
        run: |
          H=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (event=${{ github.event_name }}, ET hour=$H)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 9am ET (hour=$H) — skipping this trigger."
          fi

      - name: Checkout repository
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip tooling
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip setuptools packaging

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install -r requirements.txt

      - name: Write Google credentials
        if: steps.guard.outputs.run == 'true'
        run: |
          mkdir -p credentials
          cat <<EOF > credentials/service_account.json
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Run JobSpy ingestion job agent
        if: steps.guard.outputs.run == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          PYTHONPATH=src python src/run_jobspy_ingestion.py

      # Fallback source: the SimplifyJobs New-Grad-Positions repo (SWE +
      # AI/ML). `!cancelled()` (instead of the implicit success()) means this
      # runs even when the Google Search step above failed, so a SerpAPI/Gemini
      # outage doesn't leave the day with zero jobs. Needs no SerpAPI key.
      - name: Run New-Grad GitHub ingestion (fallback source)
        if: steps.guard.outputs.run == 'true' && !cancelled()
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          PYTHONPATH=src python src/run_new_grad_github_ingestion.py

      # Gmail application-status scan: read recent emails, match to applied
      # jobs, classify status via Groq, update the DB. `!cancelled()` so it
      # still runs if a scrape step above failed.
      - name: Run Gmail status scan
        if: steps.guard.outputs.run == 'true' && !cancelled()
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          PYTHONPATH=src python src/run_email_status_scan.py
