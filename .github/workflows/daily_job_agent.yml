name: Daily Job Agent

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools packaging

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Write Google credentials
        run: |
          mkdir -p credentials
          cat <<EOF > credentials/service_account.json
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Run Google Search ingestion job agent
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials/service_account.json
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          PYTHONPATH=src python src/run_google_search_ingestion.py
